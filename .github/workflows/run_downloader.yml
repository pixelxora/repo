name: Telegram Zip Extractor Bot

on:
  workflow_dispatch:
    inputs:
      start_link:
        description: 'Paste the START message link (https://t.me/c/...)'
        required: true
      end_link:
        description: 'Paste the END message link (https://t.me/c/...)'
        required: true

jobs:
  download-and-extract:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Initialize Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Utilities (7z Archive Handler)
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full p7zip-rar

    - name: Install Project Dependencies
      run: |
        pip install -r requirements.txt

    - name: Execute Telegram Downloader Pipeline
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        SESSION_STRING: ${{ secrets.SESSION_STRING }}
        BUNNY_LIBRARY_ID: ${{ secrets.BUNNY_LIBRARY_ID }}
        BUNNY_STREAM_KEY: ${{ secrets.BUNNY_STREAM_KEY }}
        START_LINK: ${{ github.event.inputs.start_link }}
        END_LINK: ${{ github.event.inputs.end_link }}
      run: python download.py
