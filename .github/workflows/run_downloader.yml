name: Telegram Zip Extractor Bot

on:
  workflow_dispatch:
    inputs:
      start_link:
        description: 'Paste the START message link (https://t.me/c/...)'
        required: true
      end_link:
        description: 'Paste the END message link (https://t.me/c/...)'
        required: true

jobs:
  download-and-extract:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Initialize Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Utilities (7z Archive Handler)
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full p7zip-rar

    - name: Install Project Dependencies
      run: |
        pip install -r requirements.txt

    - name: Execute Telegram Downloader Pipeline
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        START_LINK: ${{ github.event.inputs.start_link }}
        END_LINK: ${{ github.event.inputs.end_link }}
      run: python download.py

    - name: Push Extracted Materials to Output Queue
      uses: actions/upload-artifact@v4
      with:
        name: extracted-materials-queue
        path: ./extracted_material/
        retention-days: 3
